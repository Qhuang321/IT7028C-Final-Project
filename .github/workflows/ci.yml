name: Retail Application CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Buid Docker image
        run: docker build -t retail-app:test .
      - name: Run container
        run: docker run -d -p 8080:80 --name retail-test retail-app:test
      - name: Test web application
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080 | grep -q "Retail Technology Cloud Application";
            then
              echo "Application test passed"
              exit 0
            fi  
            sleep 2
          done
          echo "Application test failed"
          docker logs retail-test 
          exit 1 


